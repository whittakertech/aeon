site_name: WhittakerTech — Aeon
site_description: Temporal Engine for WhittakerTech
site_author: Lee Whittaker
repo_url: https://github.com/whittaker-tech/aeon
repo_name: whittaker-tech/aeon
site_url: https://whittaker-tech.github.io/aeon/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
    - scheme: slate
      primary: indigo
      accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.annotate

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes
  - codehilite
  - def_list
  - tables
  - pymdownx.tasklist

nav:
  - Overview: architecture/_index.md
  - Architecture:
      - "Aeon Overview": architecture/AEON_OVERVIEW.md
      - "Integration Notes": architecture/AEON_INTEGRATION_NOTES.md
  - Core Layers:
      - "Period & Time Arithmetic": architecture/AEON_PERIOD.md
      - "Timestamp & Persistence": architecture/AEON_TIMESTAMP.md
      - "Recurrence Adapter": architecture/AEON_RECURRENCE.md
  - Query Layer:
      - "Timekeeper": architecture/AEON_TIMEKEEPER.md
  - Cache Layer:
      - "Cache Window": architecture/AEON_CACHEWINDOW.md
      - "Cache Manager": architecture/AEON_CACHEMANAGER.md
      - "Cache Invalidation": architecture/AEON_CACHEINVALIDATION.md
      - "Refresher": architecture/AEON_REFRESHER.md
  - Mutation Layer:
      - "Mutator": architecture/AEON_MUTATOR.md
      - "Deep Clone": architecture/AEON_DEEPCLONE.md
      - "Exception Manager": architecture/AEON_EXCEPTIONMANAGER.md
  - Integration Layer:
      - "Schedulable DSL": architecture/AEON_SCHEDULABLE.md
      - "Worker Bridge": architecture/AEON_WORKER.md
      - "Integration Surfaces": architecture/AEON_INTEGRATION_NOTES.md